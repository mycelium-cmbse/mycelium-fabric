# Mycelium login theme for Bloom, served by the Keycloak of Fabric.
# Extends the stock keycloak.v2 theme: PatternFly 5 markup, Keycloak's own templates, our CSS on top.
# Four templates are overridden (template.ftl, social-providers.ftl, error.ftl, login-otp.ftl); every other page
# (register, reset password, OTP, update password, logout, page expired...) is the stock template, styled by CSS.
parent=keycloak.v2
import=common/keycloak

# Order matters: keycloak.v2 base styles, then the Bloom DTCG tokens, then the Mycelium layer.
styles=css/styles.css css/tokens-bloom.css css/mycelium.css
scripts=js/mycelium.js

# Read by template.ftl. The version is asserted by SignInPageTestFixture, so a release edits it here only.
myceliumDocsUrl=https://github.com/mycelium-cmbse
myceliumSupportUrl=https://github.com/mycelium-cmbse
myceliumVersion=v0.4

kcBodyClass=mycelium