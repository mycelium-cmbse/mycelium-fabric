# Mycelium email theme, common to every product (one account). Branded layout around Keycloak's own bodies; the two emails a user meets
# first (verify email, reset password) also get a button.
parent=base
locales=en

# Email clients do not resolve CSS custom properties, so the light-mode tokens are spelled out here.
# They are the Mycelium (Bloom) light tokens; TokenTestFixture fails when one drifts from tokens-bloom.css.
myceliumColourPrimary=#0f9e8c
myceliumColourPrimaryForeground=#ffffff
myceliumColourForeground=#293342
myceliumColourMutedForeground=#738294
myceliumColourBackground=#f7fafc
myceliumColourCard=#ffffff
myceliumColourBorder=#e3e8ed
