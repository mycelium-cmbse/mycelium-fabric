name: Add to project board

on:
  issues:
    types: [opened]

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@v2
        with:
          project-url: https://github.com/orgs/mycelium-cmbse/projects/2
          github-token: ${{ secrets.ADD_TO_PROJECT }}
